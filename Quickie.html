<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Quickie – Mobile Punkteblatt</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    font-family: Arial, sans-serif;
    background:#f2f6ff;
    margin:0;
    padding:10px;
  }

  .sheet {
    max-width:480px;
    margin:auto;
    background:white;
    padding:15px;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,0.15);
  }

  h1, h2 {
    text-align:center;
    margin:0;
  }

  h2 {
    font-size:0.9rem;
    margin-bottom:15px;
  }

  table {
    width:100%;
    border-collapse:collapse;
    font-size:1rem;
  }

  td {
    padding:10px 6px;
    border-bottom:1px solid #ddd;
  }

  input[type="number"] {
    width:100%;
    padding:12px;
    font-size:1.2rem;
    border-radius:8px;
    border:1px solid #aaa;
    box-sizing:border-box;
  }

  input[readonly] {
    background:#f7f7f7;
  }

  .total {
    font-weight:bold;
    background:#eef2ff;
  }

  .name-input {
    width:100%;
    padding:10px;
    font-size:1.1rem;
    border:none;
    border-bottom:2px solid #000;
    margin-bottom:20px;
    box-sizing:border-box;
  }
</style>
</head>
<body>

<div class="sheet">
  <h1>Quickie</h1>
  <h2>by Schmittert Spiele</h2>

  <input class="name-input" type="text" placeholder="Name eintragen">

  <table>
    <tr>
      <td>Alle Augen zählen</td>
      <td><input type="number" class="eyes" oninput="calc()"></td>
      <td><input type="number" class="pts" readonly></td>
    </tr>

    <tr>
      <td>Zweier Pasch (×2)</td>
      <td><input type="number" class="eyes" oninput="calc()"></td>
      <td><input type="number" class="pts" readonly></td>
    </tr>

    <tr>
      <td>Dreier Pasch (×3)</td>
      <td><input type="number" class="eyes" oninput="calc()"></td>
      <td><input type="number" class="pts" readonly></td>
    </tr>

    <tr>
      <td>Vierer Pasch (×4)</td>
      <td><input type="number" class="eyes" oninput="calc()"></td>
      <td><input type="number" class="pts" readonly></td>
    </tr>

    <tr>
      <td>BoomBastic Five (100 Punkte)</td>
      <td><input type="number" class="eyes" oninput="calc()"></td>
      <td><input type="number" class="pts" readonly></td>
    </tr>

    <tr>
      <td>Volle Hütte (+25)</td>
      <td><input type="number" class="eyes bonus25" oninput="calc()"></td>
      <td><input type="number" class="pts" readonly></td>
    </tr>

    <tr>
      <td>Klitze kleine Straße (+15)</td>
      <td><input type="number" class="eyes bonus15" oninput="calc()"></td>
      <td><input type="number" class="pts" readonly></td>
    </tr>

    <tr>
      <td>Kleine Straße (+30)</td>
      <td><input type="number" class="eyes bonus30" oninput="calc()"></td>
      <td><input type="number" class="pts" readonly></td>
    </tr>

    <tr>
      <td>Große Straße (+40)</td>
      <td><input type="number" class="eyes bonus40" oninput="calc()"></td>
      <td><input type="number" class="pts" readonly></td>
    </tr>

    <tr class="total">
      <td>Gesamt</td>
      <td></td>
      <td><input type="number" id="total" readonly></td>
    </tr>
  </table>
</div>

<script>
function calc() {
  const eyes = document.querySelectorAll('.eyes');
  const pts = document.querySelectorAll('.pts');

  let sum = 0;

  // Grundpunkte
  pts[0].value = Number(eyes[0].value) || 0;
  pts[1].value = (Number(eyes[1].value) || 0) * 2;
  pts[2].value = (Number(eyes[2].value) || 0) * 3;
  pts[3].value = (Number(eyes[3].value) || 0) * 4;

  // BoomBastic Five
  pts[4].value = (Number(eyes[4].value) > 0) ? 100 : 0;

  // Bonuspunkte nur wenn Eingabe vorhanden
  pts[5].value = (Number(eyes[5].value) > 0) ? Number(eyes[5].value) + 25 : 0;
  pts[6].value = (Number(eyes[6].value) > 0) ? Number(eyes[6].value) + 15 : 0;
  pts[7].value = (Number(eyes[7].value) > 0) ? Number(eyes[7].value) + 30 : 0;
  pts[8].value = (Number(eyes[8].value) > 0) ? Number(eyes[8].value) + 40 : 0;

  // Gesamt
  pts.forEach(p => sum += Number(p.value) || 0);
  document.getElementById('total').value = sum;
}
</script>

</body>
</html>
